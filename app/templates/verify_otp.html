<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verification - MYREDGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
    <style>
        body {
            background-color: #0F1115;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .otp-card {
            background: #171A21;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .otp-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #FFF;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 12px;
            text-align: center;
            box-sizing: border-box;
            margin: 20px 0;
        }
        .otp-input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2563EB;
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1D4ED8;
        }
    </style>
</head>
<body>
    <div class="otp-card">
        <div style="font-size: 36px; margin-bottom: 8px;">🔐</div>
        <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 6px 0;">Two-Factor Verification</h2>
        <p style="font-size: 13px; color: #94A3B8; margin: 0;">Enter the 6-digit code from your authenticator app (Google Authenticator, Authy, or Apple Passwords)</p>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #F87171; padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 16px;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/api/verify-otp" method="POST">
            <input type="text" name="otp_code" class="otp-input" maxlength="6" pattern="[0-9]*" inputmode="numeric" required autofocus placeholder="000000">
            <button type="submit" class="btn-submit">Verify Code & Enter ➔</button>
        </form>

        <div style="margin-top: 20px;">
            <a href="/login" style="font-size: 12px; color: #60A5FA; text-decoration: none;">← Back to Sign In</a>
        </div>
    </div>
</body>
</html>
